<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>예제 2: 스마일 페이스</title>
</head>

<body>
    <canvas id="myCanvas" width="400" height="400" style="background: #f0f0f0;"></canvas>
<script>
    const canvas = document.getElementById
    ("myCanvas");
    const ctx = canvas.getContext("2d");

    const ball = {
        x:300, y:200, radius: 25, dx: 3, dy: 2
    };

    function drawball() {
        ctx.beginPath();
        ctx.arc(ball.x=200, ball.y=200, ball.radius=100, 0, Math.PI*2);
        ctx.fillStyle = "gold";
        ctx.fill();
        ctx.lineWidth=4;
        ctx.strokeStyle = "orange";
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ball.x=160, ball.y=170, ball.radius=12, 0, Math.PI*2);
        ctx.fillStyle = "black";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(ball.x=240, ball.y=170, ball.radius=12, 0, Math.PI*2);
        ctx.fillStyle = "black";
        ctx.fill();

        ctx.beginPath();
        ctx.arc(ball.x=200, ball.y=200, ball.radius=50, 0, Math.PI);
        ctx.lineWidth=5;
        ctx.strokeStyle = "black";
        ctx.stroke();
    }
    drawball();
</script>
</body>

</html>
