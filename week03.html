<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공 잡기 게임</title>

<style>
body{
    text-align:center;
    font-family:Arial;
}

canvas{
    border:2px solid black;
}
</style>

</head>
<body>

<h1>공 잡기 게임</h1>

<p>
점수 : <span id="score">0</span> | 
최고 점수 : <span id="highScore">0</span> | 
남은 시간 : <span id="time">30</span>초 | 
속도 : <span id="speed">1</span> 단계
</p>

<button onclick="startGame()">게임 시작</button><br><br>

<canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const scoreText = document.getElementById("score");
    const highScoreText = document.getElementById("highScore");
    const speedText = document.getElementById("speed");
    const timeText = document.getElementById("time");

    let score = 0;
    // 브라우저 저장소(localStorage)에서 최고 점수 불러오기
    let highScore = localStorage.getItem("ball_game_highscore") || 0;
    highScoreText.textContent = highScore;

    let speedLevel = 0;
    let timeLeft = 30;
    let gameRunning = false;
    let timerId;
    let animId;

    const ball = {
        x: 300, y: 200, radius: 25, dx: 3, dy: 2, isGolden: false
    };

    function startGame() {
        if(animId) {
            cancelAnimationFrame(animId);
        }

        score = 0;
        timeLeft = 30;
        speedLevel = 1;

        scoreText.textContent = score;
        timeText.textContent = timeLeft;
        speedText.textContent = speedLevel;

        ball.x = 300;
        ball.y = 200;
        ball.dx = 3;
        ball.dy = 2;
        ball.isGolden = false;

        gameRunning = true;

        clearInterval(timerId);
        timerId = setInterval(() => {
            timeLeft--;
            timeText.textContent = timeLeft;
            if(timeLeft <= 0) endGame();
        }, 1000);

        drawGame();
    }  

    function endGame(){
        gameRunning = false;
        clearInterval(timerId);

        if (animId) {
            cancelAnimationFrame(animId);
        }

        // 최고 점수 갱신 및 저장
        if (score > highScore) {
            highScore = score;
            localStorage.setItem("ball_game_highscore", highScore);
            highScoreText.textContent = highScore;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "32px Arial";
        ctx.fillStyle = "black";
        ctx.textAlign = "center";
        ctx.fillText("게임 종료!", canvas.width / 2, canvas.height / 2 - 30);
        ctx.fillText("최종점수 : " + score, canvas.width / 2, canvas.height / 2 + 10);
        ctx.fillText("최고점수 : " + highScore, canvas.width / 2, canvas.height / 2 + 50);
    }

    function drawBall() {
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI*2);
        // 보너스 공은 금색, 일반 공은 토마토색
        ctx.fillStyle = ball.isGolden ? "gold" : "tomato";
        ctx.fill();
        
        // 보너스 공 테두리 표시
        if(ball.isGolden) {
            ctx.lineWidth = 3;
            ctx.strokeStyle = "orange";
            ctx.stroke();
        }
    }

    function updateBall() {
        ball.x += ball.dx;
        ball.y += ball.dy;
        
        if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0){
            ball.dx = -ball.dx;
        }
        if (ball.y + ball.radius > canvas.height || ball.y - ball.radius < 0){
            ball.dy = -ball.dy;
        }
    }

    function drawGame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBall();
        updateBall();
        if(gameRunning) {
            animId = requestAnimationFrame(drawGame);
        }
    }

    canvas.addEventListener("click", function(event) {
        if (!gameRunning) return;

        const rect = canvas.getBoundingClientRect();
        const mouseX = event.clientX - rect.left;
        const mouseY = event.clientY - rect.top;

        const dx = mouseX - ball.x;
        const dy = mouseY - ball.y;

        const distance = Math.sqrt(dx*dx + dy*dy);

        if(distance <= ball.radius){
            // 보너스 공(금색) 클릭 시 3점 추가, 일반 공은 1점 추가
            if(ball.isGolden) {
                score += 3;
            } else {
                score++;
            }

            scoreText.textContent = score;
            speedLevel++; 
            speedText.textContent = speedLevel;
            
            if (ball.dx > 0) {
                ball.dx += 0.5;
            } else {
                ball.dx -= 0.5;
            }
            if (ball.dy > 0) {
                ball.dy += 0.5;
            } else {
                ball.dy -= 0.5;
            }

            moveBallRandom();
        }
    });

    function moveBallRandom() {
        ball.x = Math.random()*(canvas.width-ball.radius*2) + ball.radius;
        ball.y = Math.random()*(canvas.height-ball.radius*2) + ball.radius;
        // 20% 확률로 보너스 공(금색) 등장
        ball.isGolden = Math.random() < 0.2;
    }
</script>
</body>
</html>
