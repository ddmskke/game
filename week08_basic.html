<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장애물 피하기 게임</title>

    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 2px solid black;
            background: #f9f9f9;
            max-width: 100%;
        }
    </style>
</head>

<body>
    <h1>장애물 피하기 게임</h1>

    <p>
        점수: <span id="score">0</span> |
        체력: <span id="hp">100</span>
    </p>

    <p>조작: 방향키 ↑ ↓ ← →</p>

    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreText = document.getElementById("score");
        const hpText = document.getElementById("hp");

        let score = 0;
        let hp = 100;
        let gameOver = false;

        let frozenUntil = 0;

        const player = {
            x: 280,
            y: 330,
            width: 40,
            height: 40,
            speed: 6
        };

        const keys = {};
        const rocks = [];
        const healingBalls = [];

        document.addEventListener("keydown", function (event) {
            if (event.key.startsWith("Arrow")) {
                event.preventDefault();
            }

            keys[event.key] = true;
        });

        document.addEventListener("keyup", function (event) {
            keys[event.key] = false;
        });

        function drawPlayer() {

            if (Date.now() < frozenUntil &&
                Math.floor(Date.now() / 150) % 2 === 0) {
                return;
            }

            ctx.fillStyle = "royalblue";
            ctx.fillRect(
                player.x,
                player.y,
                player.width,
                player.height
            );
        }

        function movePlayer() {
            
            if (Date.now() < frozenUntil) {
                return;
            }

            if (keys["ArrowLeft"]) player.x -= player.speed;
            if (keys["ArrowRight"]) player.x += player.speed;
            if (keys["ArrowUp"]) player.y -= player.speed;
            if (keys["ArrowDown"]) player.y += player.speed;

         
            player.x = Math.max(
                0,
                Math.min(player.x, canvas.width - player.width)
            );

            player.y = Math.max(
                0,
                Math.min(player.y, canvas.height - player.height)
            );
        }

        function createRock() {
            if (gameOver) return;

            const size = 30;

            rocks.push({
                x: Math.random() * (canvas.width - size),
                y: -size,
                width: size,
                height: size,
                speed: Math.random() * 3 + 2,
                damage: 20
            });
        }

        function drawRocks() {
            ctx.fillStyle = "gray";

            for (const rock of rocks) {
                ctx.beginPath();
                ctx.arc(
                    rock.x + rock.width / 2,
                    rock.y + rock.height / 2,
                    rock.width / 2,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            }
        }

        function moveRocks() {
            for (let i = rocks.length - 1; i >= 0; i--) {
                const rock = rocks[i];
                rock.y += rock.speed;

                if (rock.y > canvas.height) {
                    rocks.splice(i, 1);
                    score++;
                    scoreText.textContent = score;
                }
            }
        }

        function isColliding(a, b) {
            return (
                a.x < b.x + b.width &&
                a.x + a.width > b.x &&
                a.y < b.y + b.height &&
                a.y + a.height > b.y
            );
        }


        function checkCollision() {

            if (Date.now() < frozenUntil) return;

            for (let i = rocks.length - 1; i >= 0; i--) {
                const rock = rocks[i];

                if (isColliding(player, rock)) {
                    hp = Math.max(0, hp - rock.damage);
                    hpText.textContent = hp;

                    rocks.splice(i, 1);

                    frozenUntil = Date.now() + 2000;

                    if (hp === 0) {
                        gameOver = true;
                    }

                    return;
                }
            }
        }

        function createHealingBall() {
            if (gameOver) return;

            const size = 24;

            healingBalls.push({
                x: Math.random() * (canvas.width - size),
                y: Math.random() * (canvas.height - size),
                width: size,
                height: size,
                heal: 5
            });
        }

        function drawHealingBalls() {
            for (const ball of healingBalls) {
                ctx.beginPath();
                ctx.fillStyle = "deepskyblue";

                ctx.arc(
                    ball.x + ball.width / 2,
                    ball.y + ball.height / 2,
                    ball.width / 2,
                    0,
                    Math.PI * 2
                );

                ctx.fill();
            }
        }

        function checkHealingCollision() {
            for (let i = healingBalls.length - 1; i >= 0; i--) {
                const ball = healingBalls[i];

                if (isColliding(player, ball)) {
                    hp = Math.min(100, hp + ball.heal);
                    hpText.textContent = hp;

                    healingBalls.splice(i, 1);
                }
            }
        }

        function drawHpBar() {
            ctx.fillStyle = "lightgray";
            ctx.fillRect(20, 20, 200, 20);

            if (hp <= 30) {
                ctx.fillStyle = "red";
            } else {
                ctx.fillStyle = "limegreen";
            }

            ctx.fillRect(20, 20, hp * 2, 20);

            ctx.strokeStyle = "black";
            ctx.strokeRect(20, 20, 200, 20);
        }

        function endGame() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            ctx.font = "bold 32px Arial";

            ctx.fillText(
                "게임 오버!",
                canvas.width / 2,
                canvas.height / 2 - 20
            );

            ctx.font = "24px Arial";

            ctx.fillText(
                "점수: " + score,
                canvas.width / 2,
                canvas.height / 2 + 25
            );
        }

        const rockTimer = setInterval(createRock, 1000);
        const healingTimer = setInterval(createHealingBall, 5000);

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameOver) {
                drawHpBar();
                drawPlayer();
                drawRocks();
                drawHealingBalls();
                endGame();

                clearInterval(rockTimer);
                clearInterval(healingTimer);
                return;
            }

            movePlayer();
            moveRocks();

            checkCollision();
            checkHealingCollision();

            drawHpBar();
            drawPlayer();
            drawRocks();
            drawHealingBalls();

            if (gameOver) {
                endGame();
                clearInterval(rockTimer);
                clearInterval(healingTimer);
                return;
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
